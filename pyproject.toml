[build-system]
requires = ["setuptools>=61.2", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.pytype]
inputs = ["src/nanoemoji"]
# generated by setuptools_scm at build time; its PEP 604 annotations
# (`str | None`) aren't analyzable by pytype
exclude = ["src/nanoemoji/_version.py"]

[build-system]
requires = ["setuptools>=61.2", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["src/nanoemoji/**/*.py"]

# fontTools' table objects set their attributes at runtime (via setattr
# during decompile), so they're invisible to a static checker and every
# access looks like an error. That's not going away, so ttLib.tables alone
# is treated as Any; the rest of fontTools (TTFont included) and all other
# deps stay checked.
replace-imports-with-any = ["fontTools.ttLib.tables", "fontTools.ttLib.tables.*"]
